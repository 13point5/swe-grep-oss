max_steps = 20
seq_len = 4096

[deployment]
num_train_gpus = 1
num_infer_gpus = 1
gpus_per_node = 2

[model]
name = "Qwen/Qwen3-4B-Instruct-2507"

[trainer.optim]
lr = 1e-5
weight_decay = 0.0

[trainer.model.lora]
rank = 8
alpha = 32

[orchestrator]
batch_size = 128
rollouts_per_example = 4

[orchestrator.sampling]
max_tokens = 1024

[[orchestrator.env]]
id = "swe-grep-oss"
name = "swe-grep-oss"
args = { dataset_name = "swe-bench-lite" }

[orchestrator.val]
interval = 10
num_examples = 16

[inference]
gpu_memory_utilization = 0.7

[inference.model]
tool_call_parser = "hermes"
max_model_len = 4096
