[project]
name = "swe-grep-oss"
description = "An open-source implementation of Cognition's SWE-grep."
tags = ["swe-bench", "tool-use", "repository-search", "train", "eval"]
version = "0.1.2"
requires-python = ">=3.10"
dependencies = [
    "datasets>=4.2.0",
    "prime-sandboxes>=0.2.16",
    "verifiers>=0.1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = [
    "swe_grep_oss.py",
    "prompts",
    "rewards",
    "tools",
    "utils",
]
